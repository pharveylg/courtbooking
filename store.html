<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pickle Court Store</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",monospace}
</style>
</head>
<body class="bg-[#FFFBF5] text-[#201C19] antialiased min-h-screen grid place-items-center p-6">

<div class="w-full max-w-[440px] rounded-[28px] bg-white border border-[#EAE0D5] shadow-[0_20px_60px_rgba(32,28,25,0.1)] p-7 md:p-9 text-center">
  <div id="storeLogo" class="mx-auto w-14 h-14 rounded-full bg-[#201C19] text-white grid place-items-center font-black text-[16px] overflow-hidden">PS</div>
  <div id="storeStateWrap">
    <p class="mt-5 mono text-[12px] opacity-60">Loading Store...</p>
  </div>
</div>

<script>
/* ---------- Tenant resolution (mirrors index.html's getCurrentTenant) ---------- */
function getCurrentTenant(){
  const urlParams = new URLSearchParams(window.location.search);
  const queryClient = urlParams.get('client');
  if(queryClient && /^[a-z0-9-]+$/.test(queryClient)) return queryClient;
  return null;
}
const currentClientId = getCurrentTenant();

const FIREBASE_CFG = (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !String(window.FIREBASE_CONFIG.apiKey).startsWith('PASTE')) ? window.FIREBASE_CONFIG : null;
const FB_ENABLED = !!(FIREBASE_CFG && FIREBASE_CFG.projectId);
let db = null;
if (FB_ENABLED) {
  try { firebase.initializeApp(FIREBASE_CFG); db = firebase.firestore(); }
  catch(e) { console.warn('[PickleStore] Firebase init failed:', e.message); }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
async function hashPin(pin){
  const encoder = new TextEncoder();
  const data = encoder.encode(pin + 'picklecourt-salt-2024');
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function renderState(html){
  document.getElementById('storeStateWrap').innerHTML = html;
}

function renderNoTenant(){
  renderState(`
    <h1 class="mt-5 text-[20px] font-[800] tracking-[-0.02em]">No Facility Selected</h1>
    <p class="mt-2.5 mono text-[12px] leading-[1.6] opacity-70">Open this page with <code class="bg-[#F1E9DF] px-1.5 py-0.5 rounded">?client=yourfacility</code> in the URL.</p>
  `);
}

function renderNotAvailable(bizName){
  renderState(`
    <h1 class="mt-5 text-[20px] font-[800] tracking-[-0.02em]">Store Not Available</h1>
    <p class="mt-2.5 mono text-[12px] leading-[1.6] opacity-70">${escapeHtml(bizName)} hasn't added Pickle Court Store yet. This is separate from their booking page, which is unaffected either way.</p>
  `);
}

function renderPaused(bizName){
  renderState(`
    <h1 class="mt-5 text-[20px] font-[800] tracking-[-0.02em]">Store Paused</h1>
    <p class="mt-2.5 mono text-[12px] leading-[1.6] opacity-70">${escapeHtml(bizName)}'s Store has been temporarily paused by the platform operator. Their booking page is unaffected -- this pause is Store-only.</p>
  `);
}

function renderPinGate(bizName){
  renderState(`
    <h1 class="mt-5 text-[20px] font-[800] tracking-[-0.02em]">${escapeHtml(bizName)} Store</h1>
    <p class="mt-2.5 mono text-[12px] leading-[1.6] opacity-70">Enter the Store staff PIN to continue. This is separate from the facility's Booking Admin PIN.</p>
    <form id="storePinForm" class="mt-5 space-y-3">
      <input id="storePinInput" type="password" inputmode="numeric" maxlength="8" placeholder="Store PIN" class="w-full h-12 rounded-full border border-[#EAE0D5] bg-[#FFFBF5] px-5 mono text-[16px] font-[700] tracking-widest outline-none focus:border-[#201C19] text-center"/>
      <div id="storePinError" class="hidden mono text-[12px] text-[#8C2C10] bg-[#FFE9E0] border border-[#FFC9B6] rounded-full px-4 py-2.5 text-center font-[600]"></div>
      <button type="submit" class="w-full h-12 rounded-full bg-[#201C19] text-white font-[800] text-[14px] tracking-wide hover:opacity-90 active:scale-[0.98] transition">Unlock Store →</button>
    </form>
  `);
  document.getElementById('storePinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('storePinInput');
    const err = document.getElementById('storePinError');
    try {
      const snap = await db.doc(`clients/${currentClientId}/storeSettings/state`).get();
      const storedHash = snap.exists && snap.data().data && snap.data().data.pin;
      const inputHash = await hashPin(input.value.trim());
      if(storedHash && inputHash === storedHash){
        renderUnlocked(bizName);
      } else {
        err.textContent = 'Incorrect PIN.';
        err.classList.remove('hidden');
      }
    } catch(ex) {
      err.textContent = 'Failed to verify PIN: ' + ex.message;
      err.classList.remove('hidden');
    }
  });
}

function renderUnlocked(bizName){
  renderState(`
    <h1 class="mt-5 text-[20px] font-[800] tracking-[-0.02em]">${escapeHtml(bizName)} Store</h1>
    <div class="mt-3 inline-flex items-center gap-2 px-3 h-7 rounded-full bg-[#E8F5D8] border border-[#CFE8B5] mono text-[11px] font-[700] text-[#3F7019]">Access Granted</div>
    <p class="mt-4 mono text-[12px] leading-[1.6] opacity-70">The product catalog, POS, and inventory screens aren't built yet -- this confirms the Store entitlement and PIN gate are wired up correctly. Point of sale is next.</p>
  `);
}

async function init(){
  if(!currentClientId){ renderNoTenant(); return; }
  if(!db){ renderState(`<p class="mt-5 mono text-[12px] text-[#8C2C10]">Firebase is not configured.</p>`); return; }
  try {
    const [statusSnap, configSnap] = await Promise.all([
      db.doc(`clients/${currentClientId}/status/state`).get(),
      db.doc(`clients/${currentClientId}/config/state`).get(),
    ]);
    const status = (statusSnap.exists && statusSnap.data().data) || {};
    const cfg = (configSnap.exists && configSnap.data().data) || {};
    const bizName = (cfg.business && cfg.business.name) || cfg.businessName || currentClientId;
    document.title = `${bizName} — Pickle Court Store`;

    if(!status.storeEnabled){ renderNotAvailable(bizName); return; }
    if(status.storePaused){ renderPaused(bizName); return; }
    renderPinGate(bizName);
  } catch(ex) {
    renderState(`<p class="mt-5 mono text-[12px] text-[#8C2C10]">Failed to load: ${escapeHtml(ex.message)}</p>`);
  }
}
init();
</script>
</body>
</html>
