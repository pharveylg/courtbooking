<!-- Tenant Picker Overlay -->
<div id="tenantPickerOverlay" class="fixed inset-0 z-[10000] bg-[#201C19] flex flex-col" style="display:none">
  <!-- Header -->
  <div class="p-6 md:p-8 border-b border-white/10">
    <div class="max-w-2xl mx-auto">
      <h1 class="text-[28px] md:text-[36px] font-[800] text-white tracking-[-0.03em]">Choose your facility</h1>
      <p class="mono text-[12px] text-white/60 mt-2">Select a facility to get started</p>
      <!-- Search -->
      <div class="mt-5 relative">
        <input 
          type="text" 
          id="tenantSearchInput" 
          placeholder="Search facilities..." 
          class="w-full h-12 rounded-[14px] bg-white/5 border border-white/10 px-4 pl-11 text-[14px] text-white placeholder:text-white/40 outline-none focus:border-[#D6FF5F] focus:bg-white/10 transition"
        />
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Tenant List -->
  <div class="flex-1 overflow-y-auto p-6 md:p-8">
    <div class="max-w-2xl mx-auto">
      <!-- Loading state -->
      <div id="tenantPickerLoading" class="flex flex-col items-center justify-center py-16">
        <div class="w-8 h-8 border-2 border-[#D6FF5F] border-t-transparent rounded-full animate-spin"></div>
        <div class="mono text-[12px] text-white/60 mt-4">Loading facilities...</div>
      </div>

      <!-- Error state -->
      <div id="tenantPickerError" class="hidden text-center py-16">
        <div class="text-[48px] mb-4">⚠️</div>
        <div class="text-white font-[700] text-[16px]">Could not load facilities</div>
        <div class="mono text-[12px] text-white/60 mt-2" id="tenantPickerErrorMsg"></div>
        <button id="tenantPickerRetryBtn" class="mt-4 px-6 h-10 rounded-full bg-[#D6FF5F] text-[#201C19] font-[700] text-[13px]">Retry</button>
      </div>

      <!-- Empty state -->
      <div id="tenantPickerEmpty" class="hidden text-center py-16">
        <div class="text-[48px] mb-4">🔍</div>
        <div class="text-white font-[700] text-[16px]">No facilities found</div>
        <div class="mono text-[12px] text-white/60 mt-2">Try a different search term</div>
      </div>

      <!-- Tenant cards -->
      <div id="tenantPickerList" class="hidden grid gap-3"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-white/10 text-center">
    <div class="mono text-[10px] text-white/40">Court Booking — Multi-Tenant PWA</div>
  </div>
</div>

<script>
// Tenant Picker Module
(function() {
  'use strict';

  const LS_TENANT_KEY = 'cb_selected_tenant';
  const TENANT_DIRECTORY_COLLECTION = 'tenantDirectory';

  // DOM refs
  const overlay = document.getElementById('tenantPickerOverlay');
  const searchInput = document.getElementById('tenantSearchInput');
  const loadingEl = document.getElementById('tenantPickerLoading');
  const errorEl = document.getElementById('tenantPickerError');
  const errorMsg = document.getElementById('tenantPickerErrorMsg');
  const retryBtn = document.getElementById('tenantPickerRetryBtn');
  const emptyEl = document.getElementById('tenantPickerEmpty');
  const listEl = document.getElementById('tenantPickerList');

  let allTenants = [];

  // Check if we already have a tenant selected
  function getStoredTenant() {
    return localStorage.getItem(LS_TENANT_KEY);
  }

  function storeTenant(clientId) {
    localStorage.setItem(LS_TENANT_KEY, clientId);
  }

  function clearTenant() {
    localStorage.removeItem(LS_TENANT_KEY);
  }

  // Fetch tenant directory from Firestore
  async function fetchTenants() {
    if (!window.db) {
      throw new Error('Firestore not initialized');
    }

    const snapshot = await window.db.collection(TENANT_DIRECTORY_COLLECTION)
      .where('active', '==', true)
      .orderBy('name')
      .get();

    return snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));
  }

  // Render tenant cards
  function renderTenants(tenants) {
    if (tenants.length === 0) {
      listEl.classList.add('hidden');
      emptyEl.classList.remove('hidden');
      return;
    }

    emptyEl.classList.add('hidden');
    listEl.classList.remove('hidden');

    listEl.innerHTML = tenants.map(t => `
      <button 
        class="tenant-card w-full text-left p-4 rounded-[16px] bg-white/5 border border-white/10 hover:bg-white/10 hover:border-[#D6FF5F] transition group"
        data-client-id="${t.clientId}"
      >
        <div class="flex items-start gap-3">
          ${t.logoUrl ? `
            <img src="${t.logoUrl}" alt="" class="w-12 h-12 rounded-[10px] object-cover shrink-0"/>
          ` : `
            <div class="w-12 h-12 rounded-[10px] bg-[#D6FF5F] grid place-items-center shrink-0">
              <span class="text-[#201C19] font-[800] text-[16px]">${(t.name || t.clientId).charAt(0).toUpperCase()}</span>
            </div>
          `}
          <div class="flex-1 min-w-0">
            <div class="font-[800] text-[15px] text-white group-hover:text-[#D6FF5F] transition truncate">${t.name || t.clientId}</div>
            ${t.sub ? `<div class="mono text-[11px] text-white/60 mt-0.5 truncate">${t.sub}</div>` : ''}
            ${t.location ? `<div class="mono text-[10px] text-white/40 mt-1 truncate">📍 ${t.location}</div>` : ''}
          </div>
          <svg class="w-5 h-5 text-white/30 group-hover:text-[#D6FF5F] transition shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </div>
      </button>
    `).join('');

    // Bind click handlers
    listEl.querySelectorAll('.tenant-card').forEach(card => {
      card.addEventListener('click', () => {
        const clientId = card.dataset.clientId;
        selectTenant(clientId);
      });
    });
  }

  // Filter tenants by search query
  function filterTenants(query) {
    const q = query.toLowerCase().trim();
    if (!q) return allTenants;

    return allTenants.filter(t => 
      (t.name || '').toLowerCase().includes(q) ||
      (t.sub || '').toLowerCase().includes(q) ||
      (t.clientId || '').toLowerCase().includes(q) ||
      (t.location || '').toLowerCase().includes(q)
    );
  }

  // Select a tenant and redirect
  function selectTenant(clientId) {
    storeTenant(clientId);
    
    // Build URL with client param
    const url = new URL(window.location.href);
    url.searchParams.set('client', clientId);
    
    // Reload with tenant context
    window.location.href = url.toString();
  }

  // Show the picker
  function showPicker() {
    overlay.style.display = '';
    document.body.style.overflow = 'hidden';
    loadTenants();
  }

  // Hide the picker
  function hidePicker() {
    overlay.style.display = 'none';
    document.body.style.overflow = '';
  }

  // Load tenants from Firestore
  async function loadTenants() {
    loadingEl.classList.remove('hidden');
    errorEl.classList.add('hidden');
    emptyEl.classList.add('hidden');
    listEl.classList.add('hidden');

    try {
      allTenants = await fetchTenants();
      loadingEl.classList.add('hidden');
      renderTenants(allTenants);
      searchInput.focus();
    } catch (err) {
      console.error('[TenantPicker] Failed to load tenants:', err);
      loadingEl.classList.add('hidden');
      errorEl.classList.remove('hidden');
      errorMsg.textContent = err.message;
    }
  }

  // Search handler
  searchInput.addEventListener('input', (e) => {
    const filtered = filterTenants(e.target.value);
    renderTenants(filtered);
  });

  // Retry handler
  retryBtn.addEventListener('click', loadTenants);

  // Expose switch function globally
  window.switchTenant = function() {
    clearTenant();
    const url = new URL(window.location.href);
    url.searchParams.delete('client');
    window.location.href = url.toString();
  };

  // Check on load if we need to show the picker
  // Wait for Firebase to be ready
  function checkAndShowPicker() {
    // If tenant already selected via URL or localStorage, don't show
    const urlParams = new URLSearchParams(window.location.search);
    const queryClient = urlParams.get('client');
    const storedClient = getStoredTenant();

    if (queryClient || storedClient) {
      // Tenant already selected, don't show picker
      return;
    }

    // No tenant selected, show picker
    // But wait for Firebase to be ready
    if (window.db) {
      showPicker();
    } else {
      // Retry after a short delay
      setTimeout(checkAndShowPicker, 500);
    }
  }

  // Start checking after DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(checkAndShowPicker, 100));
  } else {
    setTimeout(checkAndShowPicker, 100);
  }

})();
</script>
