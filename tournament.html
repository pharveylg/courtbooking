<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tournament</title>
<link rel="stylesheet" href="tailwind.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="pickleball-scoring.js"></script>
<script src="court-scoreboard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",monospace}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#e5ddd4;border-radius:999px}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
</style>
</head>
<body class="bg-[#FFFBF5] text-[#201C19] antialiased">

<!-- Gate screen: loading / not found / not published -->
<div id="gateScreen" class="min-h-screen grid place-items-center p-6">
  <div class="w-full max-w-[440px] rounded-[28px] bg-white border border-[#EAE0D5] shadow-[0_20px_60px_rgba(32,28,25,0.1)] p-7 md:p-9 text-center">
    <div class="mx-auto w-14 h-14 rounded-full bg-[#201C19] text-[#D6FF5F] grid place-items-center font-black text-[20px]">🏆</div>
    <div id="gateStateWrap">
      <p class="mt-5 mono text-[12px] opacity-60">Loading tournament...</p>
    </div>
  </div>
</div>

<!-- Main page -->
<div id="appScreen" class="hidden">
  <header class="sticky top-0 z-30 backdrop-blur-xl bg-[#FFFBF5]/90 border-b border-[#EAE0D5]">
    <div class="max-w-[860px] mx-auto px-4 py-4">
      <div id="hostLabel" class="mono text-[10px] uppercase tracking-widest opacity-50"></div>
      <div class="flex items-start justify-between gap-3 flex-wrap mt-0.5">
        <h1 id="tournamentName" class="text-[22px] md:text-[26px] font-[800] tracking-[-0.02em] leading-tight"></h1>
        <span id="tournamentStatusBadge" class="shrink-0 mt-1"></span>
      </div>
      <div id="tournamentMeta" class="mono text-[11px] opacity-60 mt-1.5 leading-[1.6]"></div>
    </div>
  </header>

  <main class="max-w-[860px] mx-auto px-4 py-5">
    <div id="cancelledBanner" class="hidden mb-4 p-3.5 rounded-[16px] bg-[#FFE9E0] border border-[#FFC9B6] text-[#8C2C10] mono text-[12px] font-[700] text-center">
      This tournament has been cancelled.
    </div>

    <div id="announcementsSection" class="hidden mb-5 space-y-2">
      <div class="mono text-[10px] uppercase tracking-widest opacity-50">Announcements</div>
      <div id="announcementsList" class="space-y-1.5"></div>
    </div>

    <section id="my" class="mb-5 rounded-[20px] bg-white border border-[#EAE0D5] overflow-hidden">
      <button id="myToggle" type="button" class="w-full flex items-center justify-between gap-3 p-4 text-left cursor-pointer" aria-expanded="false" aria-controls="myBody">
        <span class="font-[800] text-[14px]">🏓 My matches &amp; alerts</span>
        <span id="myToggleHint" class="mono text-[10px] opacity-50 text-right">Find your court and time</span>
      </button>
      <div id="myBody" class="hidden px-4 pb-4">
        <form id="myForm" class="flex gap-2 flex-wrap">
          <input id="myPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" aria-label="Mobile number you registered with" placeholder="Mobile number you registered with" class="flex-1 min-w-[200px] h-11 px-4 rounded-full border border-[#EAE0D5] bg-[#FFFBF5] mono text-[12px] outline-none focus:border-[#201C19]"/>
          <button type="submit" class="h-11 px-5 rounded-full bg-[#201C19] text-white mono text-[11px] font-[800] cursor-pointer">Show my matches</button>
        </form>
        <div id="myMsg" class="hidden mono text-[11px] mt-2.5 leading-[1.6]"></div>
        <div id="myResult" class="mt-3"></div>
      </div>
    </section>

    <div id="divisionTabs" class="hidden flex flex-wrap gap-1.5 mb-4"></div>

    <div id="divisionContent"></div>

    <div id="gallerySection" class="hidden mt-6">
      <div class="mono text-[10px] uppercase tracking-widest opacity-50 mb-2">Gallery</div>
      <div id="galleryGrid" class="grid grid-cols-3 gap-2"></div>
    </div>
  </main>

  <footer class="max-w-[860px] mx-auto px-4">
    <div class="dula-credit" style="display:flex;justify-content:center;padding:20px 0 28px"><span style="display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px 0 6px;border-radius:999px;background:#ffffff;border:1px solid #EAE0D5;font:500 12.5px 'JetBrains Mono',ui-monospace,monospace;color:#201C19"><span aria-hidden="true" style="width:26px;height:26px;border-radius:50%;background:#201C19;color:#D6FF5F;display:grid;place-items:center;font:900 12px 'Bricolage Grotesque',system-ui,sans-serif">D</span><span>Powered by <a href="https://dulahq.app" target="_blank" rel="noopener" style="font-weight:800;color:inherit;text-decoration:underline;text-underline-offset:3px">DulaHQ</a></span></span></div>
  </footer>
</div>

<script>
/* ================================================================
   TENANT + TOURNAMENT RESOLUTION, FIREBASE INIT
   (same conventions as store.html / tournament-admin.html; this page
   has no PIN gate at all -- it's the platform's one genuinely public
   page besides index.html itself, gated only by the tournament's own
   status, never by the Tournaments add-on's entitlement flags. A
   published event stays visible even if the tenant's entitlement is
   later paused or removed -- pausing/removing only affects the
   ability to create or manage NEW tournaments, per the independent-
   lifecycle rule this whole feature is built around.)
   ================================================================ */
function getParams(){
  const p = new URLSearchParams(window.location.search);
  const client = p.get('client');
  const t = p.get('t');
  return {
    client: (client && /^[a-z0-9-]+$/.test(client)) ? client : null,
    tournamentId: (t && /^[a-zA-Z0-9_-]+$/.test(t)) ? t : null,
  };
}
const { client: currentClientId, tournamentId: CURRENT_TOURNAMENT_ID } = getParams();

const FIREBASE_CFG = (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !String(window.FIREBASE_CONFIG.apiKey).startsWith('PASTE')) ? window.FIREBASE_CONFIG : null;
const FB_ENABLED = !!(FIREBASE_CFG && FIREBASE_CFG.projectId);
let db = null;
if (FB_ENABLED) {
  try { firebase.initializeApp(FIREBASE_CFG); db = firebase.firestore(); }
  catch(e) { console.warn('[PickleTournamentPublic] Firebase init failed:', e.message); }
}

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(iso){
  if(!iso) return '';
  try { return new Date(iso + 'T00:00:00').toLocaleDateString('en-PH', {weekday:'short', month:'short', day:'numeric', year:'numeric'}); }
  catch(e){ return iso; }
}
function fmtHour(h){
  if(h == null) return '';
  const period = h >= 12 ? 'PM' : 'AM';
  const hour12 = h % 12 === 0 ? 12 : h % 12;
  return `${hour12}${period}`;
}

function renderGateState(html){
  document.getElementById('gateStateWrap').innerHTML = html;
}
function showNotFound(){
  renderGateState(`
    <h2 class="mt-5 text-[19px] font-[800] tracking-[-0.02em]">Tournament Not Found</h2>
    <p class="mt-2.5 mono text-[12px] leading-[1.6] opacity-70">This link may be out of date, or the tournament may have been removed.</p>
  `);
}
function showNotPublished(){
  renderGateState(`
    <h2 class="mt-5 text-[19px] font-[800] tracking-[-0.02em]">Not Published Yet</h2>
    <p class="mt-2.5 mono text-[12px] leading-[1.6] opacity-70">This tournament is still being set up. Check back soon.</p>
  `);
}

/* ================================================================
   TOURNAMENT DOC (live) -- header, status, announcements
   ================================================================ */
const CATEGORY_LABELS = { MS:"Men's Singles", WS:"Women's Singles", MD:"Men's Doubles", WD:"Women's Doubles", MX:'Mixed Doubles', custom:'Custom' };
const FORMAT_LABELS = { round_robin:'Round Robin', single_elim:'Single Elimination', group_knockout:'Group Stage → Knockout' };
function tournamentStatusBadge(status){
  const map = {
    published: { bg:'#E8F5D8', fg:'#3F7019', label:'Published' },
    live:      { bg:'#D6FF5F', fg:'#201C19', label:'Live' },
    completed: { bg:'#E4E1FF', fg:'#4A3FA0', label:'Completed' },
    cancelled: { bg:'#FFE9E0', fg:'#8C2C10', label:'Cancelled' },
  };
  const s = map[status] || map.published;
  return `<span class="mono text-[9.5px] uppercase tracking-widest font-[800] px-2.5 py-1 rounded-full" style="background:${s.bg};color:${s.fg}">${s.label}</span>`;
}

let DIVISIONS = [];
let CURRENT_DIVISION_ID = null;
let unsubMatches = null, unsubStandings = null;

function renderHeader(t, bizName){
  document.getElementById('hostLabel').textContent = bizName;
  document.getElementById('tournamentName').textContent = t.name || 'Untitled Tournament';
  document.getElementById('tournamentStatusBadge').innerHTML = tournamentStatusBadge(t.status);
  document.title = `${t.name || 'Tournament'} — ${bizName}`;

  const dateLine = t.startDate === t.endDate || !t.endDate ? fmtDate(t.startDate) : `${fmtDate(t.startDate)} – ${fmtDate(t.endDate)}`;
  const typeLine = t.eventType === 'dual'
    ? `Dual Meet${t.otherClubsText ? ' vs ' + escapeHtml(t.otherClubsText) : ''}`
    : 'Intra-Club Tournament';
  document.getElementById('tournamentMeta').innerHTML = [
    dateLine,
    t.venue ? escapeHtml(t.venue) : '',
    typeLine,
  ].filter(Boolean).join(' &middot; ');

  document.getElementById('cancelledBanner').classList.toggle('hidden', t.status !== 'cancelled');
  renderAnnouncements(t.announcements || []);
}
function renderAnnouncements(announcements){
  const section = document.getElementById('announcementsSection');
  if(!announcements || announcements.length === 0){ section.classList.add('hidden'); return; }
  section.classList.remove('hidden');
  const sorted = [...announcements].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  document.getElementById('announcementsList').innerHTML = sorted.map(a => `
    <div class="p-2.5 rounded-[12px] bg-white border border-[#EAE0D5] mono text-[11.5px]">${escapeHtml(a.text)}</div>
  `).join('');
}

/* ================================================================
   DIVISIONS -- tabs + per-division content
   ================================================================ */
async function loadDivisionsAndRender(){
  const snap = await db.collection(`clients/${currentClientId}/tournaments/${CURRENT_TOURNAMENT_ID}/divisions`).orderBy('createdAt', 'asc').get();
  DIVISIONS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  if(DIVISIONS.length === 0){
    document.getElementById('divisionContent').innerHTML = `<div class="mono text-[12px] opacity-50 text-center py-10">Divisions haven't been added yet.</div>`;
    return;
  }
  const tabsWrap = document.getElementById('divisionTabs');
  if(DIVISIONS.length > 1){
    tabsWrap.classList.remove('hidden');
    tabsWrap.innerHTML = DIVISIONS.map(d => `<button data-division-tab="${d.id}" class="division-tab-btn h-9 px-3.5 rounded-full mono text-[11px] font-[700] border border-[#EAE0D5] cursor-pointer transition">${escapeHtml(d.name)}</button>`).join('');
    tabsWrap.querySelectorAll('[data-division-tab]').forEach(btn => btn.addEventListener('click', () => selectDivision(btn.dataset.divisionTab)));
  }
  selectDivision(DIVISIONS[0].id);
}
function selectDivision(divisionId){
  CURRENT_DIVISION_ID = divisionId;
  document.querySelectorAll('.division-tab-btn').forEach(b => {
    const active = b.dataset.divisionTab === divisionId;
    b.classList.toggle('bg-[#201C19]', active);
    b.classList.toggle('text-white', active);
    b.classList.toggle('bg-white', !active);
  });
  renderDivisionShell();
  loadRegistrationCount(divisionId);
  subscribeToDivisionData(divisionId);
}

function renderDivisionShell(){
  const div = DIVISIONS.find(d => d.id === CURRENT_DIVISION_ID);
  const hasBracketView = div.format === 'single_elim' || div.format === 'group_knockout';
  document.getElementById('divisionContent').innerHTML = `
    <div class="rounded-[20px] bg-white border border-[#EAE0D5] p-4 md:p-5 mb-4">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <span class="font-[800] text-[15px]">${escapeHtml(div.name)}</span>
        <span class="mono text-[10px] opacity-50">${CATEGORY_LABELS[div.category] || div.category} &middot; ${FORMAT_LABELS[div.format] || div.format}</span>
      </div>
      <div id="registrationCountLine" class="mono text-[10.5px] opacity-50 mt-1"></div>
      <div id="participantChips" class="flex flex-wrap gap-1 mt-2.5"></div>
    </div>
    <nav class="flex items-center gap-1 bg-[#F1E9DF] p-1 rounded-full overflow-x-auto no-scrollbar mb-4 w-fit">
      <button data-view-tab="schedule" class="view-tab-btn shrink-0 px-3.5 h-8 rounded-full mono text-[11px] font-[700] transition cursor-pointer">Schedule</button>
      <button data-view-tab="standings" class="view-tab-btn shrink-0 px-3.5 h-8 rounded-full mono text-[11px] font-[700] transition cursor-pointer">Standings</button>
      <button data-view-tab="stats" class="view-tab-btn shrink-0 px-3.5 h-8 rounded-full mono text-[11px] font-[700] transition cursor-pointer">Stats</button>
      ${hasBracketView ? `<button data-view-tab="bracket" class="view-tab-btn shrink-0 px-3.5 h-8 rounded-full mono text-[11px] font-[700] transition cursor-pointer">Bracket</button>` : ''}
    </nav>
    <div id="view-schedule" class="tournament-view"><div class="mono text-[11px] opacity-50">Loading...</div></div>
    <div id="view-standings" class="tournament-view hidden"></div>
    <div id="view-stats" class="tournament-view hidden"></div>
    ${hasBracketView ? `<div id="view-bracket" class="tournament-view hidden"></div>` : ''}
  `;
  document.querySelectorAll('.view-tab-btn').forEach(btn => btn.addEventListener('click', () => showView(btn.dataset.viewTab)));
  showView('schedule');
}
function showView(view){
  document.querySelectorAll('.tournament-view').forEach(v => v.classList.toggle('hidden', v.id !== `view-${view}`));
  document.querySelectorAll('.view-tab-btn').forEach(b => {
    const active = b.dataset.viewTab === view;
    b.classList.toggle('bg-[#201C19]', active);
    b.classList.toggle('text-white', active);
    b.classList.toggle('opacity-70', !active);
  });
}

async function loadRegistrationCount(divisionId){
  const div = DIVISIONS.find(d => d.id === divisionId);
  try {
    const snap = await db.collection(`clients/${currentClientId}/tournaments/${CURRENT_TOURNAMENT_ID}/registrations`).where('divisionId', '==', divisionId).get();
    const regs = snap.docs.map(d => d.data());
    const active = regs.filter(r => r.status === 'approved' || r.status === 'checked_in');
    const waitlisted = regs.filter(r => r.status === 'waitlisted');
    document.getElementById('registrationCountLine').textContent =
      `${active.length}${div.maxParticipants ? '/' + div.maxParticipants : ''} registered${waitlisted.length ? ` · ${waitlisted.length} waitlisted` : ''}`;
    document.getElementById('participantChips').innerHTML = active.map(r =>
      `<span class="mono text-[10px] px-2.5 py-1 rounded-full bg-[#F1E9DF]">${escapeHtml((r.playerNames||[]).join(' & '))}</span>`
    ).join('');
  } catch(ex) { console.warn('[PickleTournamentPublic] Failed to load registrations:', ex.message); }
}

/* ================================================================
   MATCHES + STANDINGS -- live via onSnapshot, same read-only rules
   this page reads under everywhere else (tournaments/divisions/
   registrations/matches/standings are all open-read). Nothing on
   this page ever writes.
   ================================================================ */
function subscribeToDivisionData(divisionId){
  if(unsubMatches) unsubMatches();
  if(unsubStandings) unsubStandings();

  unsubMatches = db.collection(`clients/${currentClientId}/tournaments/${CURRENT_TOURNAMENT_ID}/matches`)
    .where('divisionId', '==', divisionId)
    .onSnapshot(snap => {
      const matches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      LAST_MATCHES = matches;
      renderSchedule(matches);
      renderBracket(matches);
      renderStatsTab(matches);
    }, ex => console.warn('[PickleTournamentPublic] matches listener failed:', ex.message));

  unsubStandings = db.doc(`clients/${currentClientId}/tournaments/${CURRENT_TOURNAMENT_ID}/standings/${divisionId}`)
    .onSnapshot(snap => renderStandings(snap.exists ? snap.data() : null),
      ex => console.warn('[PickleTournamentPublic] standings listener failed:', ex.message));
}

function matchStatusBadge(status){
  const map = {
    scheduled: { bg:'#F1E9DF', fg:'#201C19', label:'Scheduled' },
    completed: { bg:'#E8F5D8', fg:'#3F7019', label:'Final' },
    forfeit:   { bg:'#FFE9E0', fg:'#8C2C10', label:'Forfeit' },
    walkover:  { bg:'#FFE9E0', fg:'#8C2C10', label:'Walkover' },
    cancelled: { bg:'#F1E9DF', fg:'#201C19', label:'Cancelled' },
  };
  const s = map[status] || map.scheduled;
  return `<span class="mono text-[9px] uppercase tracking-widest font-[800] px-2 py-0.5 rounded-full" style="background:${s.bg};color:${s.fg}">${s.label}</span>`;
}
/* Times, venues and courts are only shown once the organizer publishes the
   schedule -- a draft is a private working copy. */
let PUB_T = null;
let LAST_MATCHES = [];
function schedulePublished(){ return !!(PUB_T && PUB_T.schedule && PUB_T.schedule.status === 'published'); }
function pubFmtMin(min){
  const h24 = Math.floor(min / 60) % 24, m = min % 60, h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  return `${h12}:${String(m).padStart(2, '0')} ${h24 < 12 ? 'AM' : 'PM'}`;
}
function publicSchedLine(s){
  const venues = (PUB_T && PUB_T.venues) || [];
  const v = venues.find(x => x.id === s.venueId);
  const c = v && (v.courts || []).find(x => x.id === s.courtId);
  const primary = PUB_T && PUB_T.scheduleConfig && PUB_T.scheduleConfig.primaryVenueId === s.venueId && venues.length > 1;
  return `<div class="mono text-[10.5px] opacity-70 mt-1">📍 <b>${escapeHtml(v ? v.name : 'Venue')}</b>${c ? ' · ' + escapeHtml(c.name) : ''} · ${escapeHtml(s.date)} · ${pubFmtMin(s.startMin)}${primary ? ' <span class="opacity-60">(primary venue)</span>' : ''}</div>${v && v.address ? `<div class="mono text-[9.5px] opacity-40">${escapeHtml(v.address)}</div>` : ''}`;
}
function matchLine(m){
  const [nameA, nameB] = m.participantNames;
  if(m.participantIds.includes('BYE')){
    return `<div class="p-3 rounded-[14px] bg-[#FFFBF5] border border-[#EAE0D5] opacity-60"><span class="font-[700] text-[12.5px]">${escapeHtml(nameA)}</span> <span class="mono text-[10px] ml-1">advances (bye)</span></div>`;
  }
  const resultLine = m.status !== 'scheduled'
    ? `<div class="mono text-[11px] mt-1">${m.games && m.games.length ? m.games.map(g => `${g.a}-${g.b}`).join(', ') : m.score ? `${m.score.a} - ${m.score.b}` : 'Forfeit'} · winner: <b>${escapeHtml(m.participantNames[m.participantIds.indexOf(m.winnerParticipantId)] || '')}</b></div>`
    : (schedulePublished() && m.sched ? publicSchedLine(m.sched)
      : (m.court || m.scheduledDate ? `<div class="mono text-[10.5px] opacity-60 mt-1">📍 ${escapeHtml(m.scheduledDate || '')}${m.scheduledHour != null ? ' · ' + fmtHour(m.scheduledHour) : ''}</div>` : ''));
  return `
    <div class="p-3 rounded-[14px] bg-white border border-[#EAE0D5]">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <span class="font-[700] text-[12.5px]">${escapeHtml(nameA)} <span class="opacity-40 font-[500]">vs</span> ${escapeHtml(nameB)}</span>
        <span class="flex items-center gap-1.5">${liveTag(m)}${matchStatusBadge(m.status)}</span>
      </div>
      ${resultLine}
    </div>`;
}
function renderSchedule(matches){
  const wrap = document.getElementById('view-schedule');
  if(!wrap) return;
  if(matches.length === 0){ wrap.innerHTML = `<div class="mono text-[11px] opacity-50 text-center py-8">Schedule not generated yet.</div>`; return; }

  const groupsPresent = [...new Set(matches.filter(m => m.groupId).map(m => m.groupId))].sort();
  const sections = [];
  if(groupsPresent.length){
    groupsPresent.forEach(g => sections.push({ label: `Group ${g}`, matches: matches.filter(m => m.groupId === g) }));
    const knockout = matches.filter(m => m.stage === 'knockout');
    if(knockout.length) sections.push({ label: 'Knockout', matches: knockout });
  } else {
    sections.push({ label: null, matches });
  }
  wrap.innerHTML = sections.map(sec => {
    const byRound = {};
    sec.matches.forEach(m => { (byRound[m.round] = byRound[m.round] || []).push(m); });
    const roundBlocks = Object.keys(byRound).sort((a,b)=>a-b).map(r => `
      <div class="mono text-[9.5px] uppercase tracking-widest opacity-50 mt-3 mb-1.5">Round ${r}</div>
      <div class="space-y-1.5">${byRound[r].sort((a,b)=>a.position-b.position).map(matchLine).join('')}</div>
    `).join('');
    return `<div>${sec.label ? `<div class="mono text-[11px] font-[700] mt-2">${escapeHtml(sec.label)}</div>` : ''}${roundBlocks}</div>`;
  }).join('');
}

function statTable(rows, cols){
  return `<div class="overflow-x-auto"><table class="w-full mono text-[11px]">
    <thead><tr class="text-left opacity-50">${cols.map(c => `<th class="pr-3 pb-1.5 font-[600]">${c.label}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr class="border-t border-[#F1E9DF]">${cols.map(c => `<td class="py-1.5 pr-3">${c.render(r)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}
function renderStandings(standings){
  const wrap = document.getElementById('view-standings');
  if(!wrap) return;
  if(!standings){ wrap.innerHTML = `<div class="mono text-[11px] opacity-50 text-center py-8">Standings will appear once matches are scored.</div>`; return; }

  if(standings.format === 'round_robin'){
    wrap.innerHTML = `<div class="rounded-[20px] bg-white border border-[#EAE0D5] p-4">` + statTable(standings.table, [
      { label: '#', render: r => r.rank }, { label: 'Team', render: r => escapeHtml(r.name) },
      { label: 'W-L', render: r => `${r.wins}-${r.losses}` }, { label: '+/-', render: r => (r.pointsFor - r.pointsAgainst) },
    ]) + `</div>`;
  } else if(standings.format === 'single_elim'){
    const statusLabel = { champion: '🏆 Champion', alive: 'Still In', eliminated: 'Eliminated' };
    wrap.innerHTML = `<div class="rounded-[20px] bg-white border border-[#EAE0D5] p-4">` + statTable(standings.table, [

/* ================================================================
   MATCH STATS -- per-division player/team leaderboard computed from
   completed matches. Reads the same matches data the Schedule tab
   already has; no additional Firestore queries needed.
   ================================================================ */
function renderStatsTab(matches){
  const wrap = document.getElementById('view-stats');
  if(!wrap) return;

  const completed = matches.filter(m => m.status === 'completed' && m.score && m.winnerParticipantId);
  if(completed.length === 0){
    wrap.innerHTML = `<div class="mono text-[11px] opacity-50 text-center py-8">Player stats will appear once matches are scored.</div>`;
    return;
  }

  // Compute per-participant stats
  const stats = {}; // keyed by participantId
  completed.forEach(m => {
    const [idA, idB] = m.participantIds;
    const [nameA, nameB] = m.participantNames;
    if(idA === 'BYE' || idB === 'BYE') return;

    // Initialize
    if(!stats[idA]) stats[idA] = { name: nameA, gp: 0, w: 0, l: 0, pf: 0, pa: 0 };
    if(!stats[idB]) stats[idB] = { name: nameB, gp: 0, w: 0, l: 0, pf: 0, pa: 0 };

    stats[idA].gp++;
    stats[idB].gp++;
    stats[idA].pf += m.score.a;
    stats[idA].pa += m.score.b;
    stats[idB].pf += m.score.b;
    stats[idB].pa += m.score.a;

    if(m.winnerParticipantId === idA){ stats[idA].w++; stats[idB].l++; }
    else { stats[idB].w++; stats[idA].l++; }
  });

  const rows = Object.values(stats).map(s => ({
    ...s,
    winPct: s.gp > 0 ? (s.w / s.gp) * 100 : 0,
    diff: s.pf - s.pa
  }));

  // Sort: Win% → Point Diff → Points For
  rows.sort((a, b) => {
    if(b.winPct !== a.winPct) return b.winPct - a.winPct;
    if(b.diff !== a.diff) return b.diff - a.diff;
    return b.pf - a.pf;
  });

  // Summary stats
  const totalMatches = completed.length;
  const totalPlayers = rows.length;
  const avgScore = Math.round(completed.reduce((sum, m) => sum + m.score.a + m.score.b, 0) / (totalMatches * 2));
  const biggestBlowout = Math.max(...completed.map(m => Math.abs(m.score.a - m.score.b)));

  // Build leaderboard table
  const tableRows = rows.map((r, i) => {
    const diffStr = r.diff > 0 ? `+${r.diff}` : `${r.diff}`;
    const diffColor = r.diff > 0 ? 'color:#15803D' : r.diff < 0 ? 'color:#B91C1C' : 'opacity:0.5';
    const isLeader = i === 0 && r.gp > 0;
    const rankBg = isLeader ? 'background:#201C19;color:#D6FF5F' : 'background:#F1E9DF;color:rgba(32,28,25,0.7)';
    return `
      <tr class="border-t border-[#F1E9DF]"${isLeader ? ' style="background:rgba(214,255,95,0.15)"' : ''}>
        <td class="py-2 pr-2"><span class="inline-grid place-items-center w-6 h-6 rounded-full text-[10px] font-[800]" style="${rankBg}">${i + 1}</span></td>
        <td class="py-2 pr-3">
          <div class="font-[800] text-[12px] tracking-[-0.01em]">${escapeHtml(r.name)}</div>
          <div class="mt-1 h-1 w-20 rounded-full bg-[#F1E9DF] overflow-hidden"><div class="h-full rounded-full bg-[#201C19]" style="width:${r.winPct}%"></div></div>
        </td>
        <td class="py-2 px-2 text-center font-[600]">${r.gp}</td>
        <td class="py-2 px-2 text-center font-[800]" style="color:#15803D">${r.w}</td>
        <td class="py-2 px-2 text-center font-[800]" style="color:#B91C1C">${r.l}</td>
        <td class="py-2 px-2 text-right font-[600]">${r.pf}</td>
        <td class="py-2 px-2 text-right font-[600]" style="opacity:0.7">${r.pa}</td>
        <td class="py-2 px-2 text-right font-[800]" style="${diffColor}">${diffStr}</td>
        <td class="py-2 pl-3 font-[800]">${Math.round(r.winPct)}<span style="opacity:0.4;font-size:9px">%</span></td>
      </tr>`;
  }).join('');

  // Win distribution bars (top 6)
  const topBars = rows.slice(0, 6).map(r => {
    const winW = r.winPct;
    const lossW = 100 - r.winPct;
    return `
      <div>
        <div class="flex items-center justify-between mb-1">
          <span class="font-[700] text-[11px] truncate max-w-[120px]">${escapeHtml(r.name)}</span>
          <span class="mono text-[9px] opacity-60">${r.w}W-${r.l}L</span>
        </div>
        <div class="h-1.5 rounded-full bg-[#F1E9DF] overflow-hidden flex">
          <div class="h-full bg-[#4ADE80]" style="width:${winW}%"></div>
          <div class="h-full bg-[#F87171]" style="width:${lossW}%"></div>
        </div>
      </div>`;
  }).join('');

  wrap.innerHTML = `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="md:col-span-2">
        <div class="rounded-[20px] bg-white border border-[#EAE0D5] p-4 md:p-5">
          <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
            <div>
              <div class="font-[800] text-[14px]">Player Leaderboard</div>
              <div class="mono text-[9.5px] opacity-50 mt-0.5">Rank: Win% → Point Diff → Points For</div>
            </div>
            <span class="mono text-[9px] px-2.5 py-1 rounded-full bg-[#201C19] text-white font-[700] uppercase tracking-wider">${totalPlayers} Players</span>
          </div>
          <div class="overflow-x-auto no-scrollbar">
            <table class="w-full mono text-[11px] whitespace-nowrap">
              <thead>
                <tr class="text-left text-[9px] uppercase tracking-wider opacity-50 border-b border-[#F1E9DF]">
                  <th class="py-2 pr-2 font-[700]">#</th>
                  <th class="py-2 pr-3 font-[700]">Player / Team</th>
                  <th class="py-2 px-2 text-center font-[700]" title="Games Played">GP</th>
                  <th class="py-2 px-2 text-center font-[700]" title="Wins">W</th>
                  <th class="py-2 px-2 text-center font-[700]" title="Losses">L</th>
                  <th class="py-2 px-2 text-right font-[700]" title="Points For">PF</th>
                  <th class="py-2 px-2 text-right font-[700]" title="Points Against">PA</th>
                  <th class="py-2 px-2 text-right font-[700]" title="Point Differential">+/−</th>
                  <th class="py-2 pl-3 font-[700]" title="Winning Percentage">Win%</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="flex flex-col gap-4">
        <div class="rounded-[20px] bg-[#201C19] text-white p-4 relative overflow-hidden">
          <div class="absolute -right-8 -top-8 w-[80px] h-[80px] rounded-full bg-[#D6FF5F]/10 blur-[2px]"></div>
          <div class="relative">
            <div class="font-[800] text-[13px]">Session Summary</div>
            <div class="mono text-[9px] opacity-50 mt-0.5 uppercase">${escapeHtml(DIVISIONS.find(d => d.id === CURRENT_DIVISION_ID)?.name || '')}</div>
          </div>
          <div class="relative mt-3 grid grid-cols-2 gap-2">
            <div class="rounded-[12px] bg-white/5 border border-white/10 p-2.5 text-center">
              <div class="font-[800] text-[20px] text-[#D6FF5F]">${totalMatches}</div>
              <div class="mono text-[8px] uppercase opacity-60 mt-0.5">Matches</div>
            </div>
            <div class="rounded-[12px] bg-white/5 border border-white/10 p-2.5 text-center">
              <div class="font-[800] text-[20px] text-[#D6FF5F]">${totalPlayers}</div>
              <div class="mono text-[8px] uppercase opacity-60 mt-0.5">Players</div>
            </div>
            <div class="rounded-[12px] bg-white/5 border border-white/10 p-2.5 text-center">
              <div class="font-[800] text-[16px]">${avgScore}</div>
              <div class="mono text-[8px] uppercase opacity-60 mt-0.5">Avg Score</div>
            </div>
            <div class="rounded-[12px] bg-white/5 border border-white/10 p-2.5 text-center">
              <div class="font-[800] text-[16px]">+${biggestBlowout}</div>
              <div class="mono text-[8px] uppercase opacity-60 mt-0.5">Blowout</div>
            </div>
          </div>
        </div>
        <div class="rounded-[20px] bg-white border border-[#EAE0D5] p-4">
          <div class="font-[800] text-[13px] mb-3">Win Distribution</div>
          <div class="space-y-2">${topBars}</div>
        </div>
      </div>
    </div>`;
}

/* ================================================================
   LIVE SCORES
   Matches in play publish their score to tournaments/{t}/live/{matchId}.
   Every viewer sees a LIVE tag; the points themselves open only for the match
   they choose to watch. A player can also KEEP SCORE on their own match: the
   live points go out as they play, and at the end the result is PROPOSED to
   the organizer (never official until the organizer accepts it).
   ================================================================ */
let LIVE = {};
let unsubLive = null;
let viewerMatchId = null;
function liveTag(m){
  if(m.status !== 'scheduled' || !LIVE[m.id]) return '';
  return `<button type="button" data-watch="${escapeHtml(m.id)}" class="mono text-[9px] uppercase tracking-widest font-[800] px-2 py-1 rounded-full bg-[#FFE9E0] text-[#8C2C10] cursor-pointer">● Live · watch</button>`;
}
function subscribeLive(){
  if(unsubLive) return;
  unsubLive = db.collection(`clients/${currentClientId}/tournaments/${CURRENT_TOURNAMENT_ID}/live`).onSnapshot(snap => {
    LIVE = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    if(LAST_MATCHES.length){ renderSchedule(LAST_MATCHES); renderBracket(LAST_MATCHES); }
    if(MY.regIds.size) renderMyMatches();
    if(viewerMatchId) renderLiveViewer();
  }, ex => console.warn('[PickleTournamentPublic] live listener failed:', ex.message));
}
function closeLiveViewer(){ viewerMatchId = null; const el = document.getElementById('liveViewer'); if(el) el.remove(); }
function openLiveViewer(matchId){
  closeLiveViewer(); viewerMatchId = matchId;
  const wrap = document.createElement('div');
  wrap.id = 'liveViewer'; wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-modal', 'true');
  wrap.className = 'fixed inset-0 z-50 bg-[#08111F] text-[#F4E7D0] flex flex-col';
  wrap.innerHTML = '<div class="flex items-center justify-between p-3"><button type="button" id="liveViewerClose" class="h-11 px-5 rounded-full border border-[#27405E] bg-[#101D30] mono text-[12px] font-[800] cursor-pointer">Close</button><span class="mono text-[10px] uppercase tracking-widest opacity-60">Live score</span><span class="w-[76px]"></span></div><div id="liveViewerBody" class="flex-1 flex flex-col items-center justify-center gap-4 p-4"></div>';
  document.body.appendChild(wrap);
  document.getElementById('liveViewerClose').addEventListener('click', closeLiveViewer);
  renderLiveViewer();
}
function renderLiveViewer(){
  const body = document.getElementById('liveViewerBody');
  if(!body) return;
  const v = LIVE[viewerMatchId];
  if(!v){
    const m = LAST_MATCHES.concat(ALL_MATCHES).find(x => x.id === viewerMatchId);
    body.innerHTML = '<div class="text-[20px] font-[800]">This match is no longer live.</div>' + (m && m.status !== 'scheduled' ? `<div class="mono text-[13px] opacity-70">Final: ${escapeHtml(m.games && m.games.length ? m.games.map(g => `${g.a}-${g.b}`).join(', ') : m.score ? `${m.score.a}-${m.score.b}` : 'see the schedule')}</div>` : '');
    return;
  }
  const side = (s) => `<div class="flex-1 min-w-0 text-center rounded-[24px] bg-[#101D30] border-2 ${v.serving === s && !v.complete && !v.gameOver ? 'border-[#D6FF5F]' : 'border-[#27405E]'} p-4">
    <div class="text-[clamp(15px,4vw,24px)] font-[800] break-words">${escapeHtml(v.names[s])}</div>
    <div class="font-[900] leading-none text-white" style="font-size:clamp(64px,22vw,180px)">${v.points[s]}</div>
    <div class="mono text-[11px] uppercase tracking-widest text-[#D6FF5F] min-h-[16px] mt-1">${v.serving === s && !v.complete && !v.gameOver ? (v.serverNumber ? `Serving · server ${v.serverNumber}` : 'Serving') : ''}</div>
    ${v.config.bestOf > 1 ? `<div class="mono text-[12px] opacity-70 mt-1">Games ${v.gamesWon[s]}</div>` : ''}
  </div>`;
  body.innerHTML = `<div class="flex gap-3 w-full max-w-[720px]">${side('home')}${side('away')}</div>
    <div class="mono text-[12px] opacity-70">${v.games.length ? 'Games: ' + v.games.map(g => `${g.home}-${g.away}`).join('  ') : ''}</div>
    <div class="mono text-[11px] opacity-50">${v.complete ? 'Match finished, waiting for the organizer' : v.gameOver ? 'Game over' : 'Updating live'}</div>`;
}
function keepScore(matchId){
  const m = ALL_MATCHES.find(x => x.id === matchId);
  if(!m || typeof CourtBoard === 'undefined') return;
  const div = DIVISIONS.find(d => d.id === m.divisionId) || {};
  const mine = MY.regs.find(r => (m.participantIds || []).includes(r.id));
  const args = { clientId: currentClientId, tournamentId: CURRENT_TOURNAMENT_ID, matchId };
  let timer = null, pending = null, last = 0, closed = false;
  const flush = async () => { timer = null; if(closed || !pending) return; const live = pending; pending = null; last = Date.now(); try { await callFn('setLiveScore', { ...args, live }); } catch(e) { /* best effort */ } };
  const push = (live) => { pending = live; if(!timer) timer = setTimeout(flush, Math.max(0, 1200 - (Date.now() - last))); };
  CourtBoard.open({
    title: `${div.name || 'Match'} · ${(m.participantNames || []).join(' vs ')}`,
    names: { home: m.participantNames[0], away: m.participantNames[1] },
    config: { ...(div.matchFormat || {}), doubles: mine ? (mine.playerIds || []).length !== 1 : true },
    storageKey: `cb_board_p_${CURRENT_TOURNAMENT_ID}_${matchId}`,
    finishLabel: 'Send result to organizer',
    onLive: push,
    onFinish: async (sum) => {
      closed = true; clearTimeout(timer);
      await callFn('proposeMatchResult', { ...args, games: sum.games.map(g => ({ a: g.home, b: g.away })) });
      setMyOpen(true);
      myMsg('Thanks. Your result was sent to the organizer, who confirms it before it counts.');
    },
    onCancel: () => { closed = true; clearTimeout(timer); callFn('setLiveScore', { ...args, clear: true }).catch(() => {}); },
  });
}
document.addEventListener('click', (e) => {
  const w = e.target.closest && e.target.closest('[data-watch]');
  if(w){ openLiveViewer(w.dataset.watch); return; }
  const k = e.target.closest && e.target.closest('[data-keep-score]');
  if(k) keepScore(k.dataset.keepScore);
});

/* ================================================================
   MY MATCHES + ALERTS
   Players have no accounts: a phone number that matches a registration is
   the only identity here. The lookup reads the same open registration and
   match data the rest of this page already reads; nothing about it is
   private that wasn't already public. Alerts (below) are opt-in web push.
   ================================================================ */
const VAPID_PUBLIC_KEY = 'BA9Ng9DBkZZ2M1Iz10L-6sRmo6VonfH_dix22fgrZCVG8JDBBeg4ni8xS3nph0CeNMKy6aB38WbdQU35G5xMZLA';
function normalizePhone(raw){
  let digits = String(raw || '').replace(/\D/g, '');
  if(digits.startsWith('0')) digits = '63' + digits.slice(1);       // 0917... -> 63917...
  else if(digits.startsWith('9') && digits.length === 10) digits = '63' + digits; // 917... -> 63917...
  return digits;
}
const lsKey = (k) => `cb_tm_${k}_${currentClientId}_${CURRENT_TOURNAMENT_ID}`;
function lsGet(k){ try { return localStorage.getItem(lsKey(k)); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(lsKey(k), v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(lsKey(k)); } catch(e){} }

let MY = { regs: [], regIds: new Set(), playerId: null };
let ALL_MATCHES = [];
let matchesLoaded = false;
let unsubAllMatches = null;
let myTimer = null;

const PLAYED_STATUSES = ['completed', 'walkover', 'forfeit', 'cancelled'];
const schedFp = (s) => s ? `${s.venueId}|${s.courtId}|${s.date}|${s.startMin}` : '';
function tzOffsetMin(){
  const n = PUB_T && PUB_T.notifications && Number(PUB_T.notifications.utcOffsetMin);
  return Number.isFinite(n) ? n : 480;
}
function slotStartMs(s){
  const [y, m, d] = s.date.split('-').map(Number);
  return Date.UTC(y, m - 1, d) + (s.startMin - tzOffsetMin()) * 60000;
}
function countdownText(ms){
  const mins = Math.round(ms / 60000);
  if(mins <= -45) return 'was due earlier';
  if(mins <= 0) return 'now';
  if(mins < 60) return `in ${mins} min${mins === 1 ? '' : 's'}`;
  const h = Math.floor(mins / 60), r = mins % 60;
  if(h < 24) return `in ${h} hr${h === 1 ? '' : 's'}${r ? ` ${r} min` : ''}`;
  const dd = Math.floor(h / 24);
  return `in ${dd} day${dd === 1 ? '' : 's'}`;
}
function myMsg(text, tone){
  const el = document.getElementById('myMsg');
  if(!text){ el.classList.add('hidden'); el.textContent = ''; return; }
  el.classList.remove('hidden');
  el.style.color = tone === 'error' ? '#8C2C10' : '#201C19';
  el.textContent = text;
}
function setMyOpen(open){
  document.getElementById('myBody').classList.toggle('hidden', !open);
  document.getElementById('myToggle').setAttribute('aria-expanded', String(open));
}

async function lookupMyMatches(rawPhone){
  const pid = normalizePhone(rawPhone);
  if(pid.length < 10 || pid.length > 15){ myMsg('Enter the mobile number you registered with.', 'error'); return false; }
  myMsg('Looking you up…');
  try {
    const snap = await db.collection(`clients/${currentClientId}/tournaments/${CURRENT_TOURNAMENT_ID}/registrations`).where('playerIds', 'array-contains', pid).get();
    const regs = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.status !== 'withdrawn');
    if(!regs.length){
      MY = { regs: [], regIds: new Set(), playerId: null };
      document.getElementById('myResult').innerHTML = '';
      myMsg("We couldn't find that number in this tournament. Use the mobile number you gave when you registered.", 'error');
      return false;
    }
    MY = { regs, regIds: new Set(regs.map(r => r.id)), playerId: pid };
    lsSet('phone', rawPhone);
    // Unlike lsSet above (namespaced per facility), this key is deliberately
    // shared across every facility on this device -- it's what lets
    // my-matches.html look this phone up once and surface matches at any
    // facility it's registered at (see platformPlayers in firestore.rules).
    try { localStorage.setItem('cb_my_phone_v1', pid); } catch(e){}
    myMsg('');
    subscribeAllMatches();
    renderMyMatches();
    return true;
  } catch(ex){
    myMsg('Could not load your matches right now. Check your connection and try again.', 'error');
    return false;
  }
}

function subscribeAllMatches(){
  if(unsubAllMatches) return;
  unsubAllMatches = db.collection(`clients/${currentClientId}/tournaments/${CURRENT_TOURNAMENT_ID}/matches`)
    .onSnapshot(snap => { ALL_MATCHES = snap.docs.map(d => ({ id: d.id, ...d.data() })); matchesLoaded = true; renderMyMatches(); },
      ex => console.warn('[PickleTournamentPublic] my-matches listener failed:', ex.message));
  if(!myTimer) myTimer = setInterval(() => { if(MY.regIds.size && !document.hidden) renderMyMatches(); }, 30000);
}

function mySide(m){ return (m.participantIds || []).findIndex(id => MY.regIds.has(id)); }
function myMatchCard(m, opts){
  const side = mySide(m);
  const opp = (m.participantNames || [])[side === 0 ? 1 : 0] || 'TBD';
  const divName = (DIVISIONS.find(d => d.id === m.divisionId) || {}).name || '';
  const stage = m.groupId ? `Group ${m.groupId}` : (m.stage === 'knockout' || m.stage === 'main') ? 'Knockout' : '';
  const where = schedulePublished() && m.sched ? publicSchedLine(m.sched) : `<div class="mono text-[10.5px] opacity-60 mt-1">${schedulePublished() ? 'Court and time to be announced' : 'Times appear here once the organizer publishes the schedule'}</div>`;
  let head;
  if(PLAYED_STATUSES.includes(m.status)){
    const won = m.winnerParticipantId && MY.regIds.has(m.winnerParticipantId);
    const sc = m.games && m.games.length ? m.games.map(g => side === 0 ? `${g.a}-${g.b}` : `${g.b}-${g.a}`).join(', ') : m.score ? (side === 0 ? `${m.score.a}-${m.score.b}` : `${m.score.b}-${m.score.a}`) : (m.status === 'cancelled' ? '' : 'forfeit');
    head = `<span class="mono text-[9px] uppercase tracking-widest font-[800] px-2 py-0.5 rounded-full" style="background:${m.status === 'cancelled' ? '#F1E9DF' : won ? '#E8F5D8' : '#FFE9E0'};color:${m.status === 'cancelled' ? '#201C19' : won ? '#3F7019' : '#8C2C10'}">${m.status === 'cancelled' ? 'Cancelled' : won ? 'Won' : 'Lost'} ${escapeHtml(sc)}</span>`;
    return `<div class="p-3 rounded-[14px] bg-white border border-[#EAE0D5]"><div class="flex items-center justify-between gap-2 flex-wrap"><span class="font-[700] text-[12.5px]">vs ${escapeHtml(opp)}</span>${head}</div><div class="mono text-[9.5px] opacity-50 mt-1">${escapeHtml([divName, stage].filter(Boolean).join(' · '))}</div></div>`;
  }
  const hot = opts && opts.next && schedulePublished() && m.sched;
  const when = hot ? `<span class="mono text-[10px] font-[800] px-2.5 py-1 rounded-full bg-[#D6FF5F] text-[#201C19]">${escapeHtml(countdownText(slotStartMs(m.sched) - Date.now()))}</span>` : '';
  return `<div class="p-3 rounded-[14px] ${hot ? 'bg-[#FFFDF0] border-2 border-[#201C19]' : 'bg-white border border-[#EAE0D5]'}">
    <div class="flex items-center justify-between gap-2 flex-wrap"><span class="font-[800] text-[13px]">vs ${escapeHtml(opp)}</span><span class="flex items-center gap-1.5">${liveTag(m)}${when}</span></div>
    ${where}
    <div class="mono text-[9.5px] opacity-50 mt-1">${escapeHtml([divName, stage, m.round ? `Round ${m.round}` : ''].filter(Boolean).join(' · '))}</div>
    <div class="mt-2"><button type="button" data-keep-score="${escapeHtml(m.id)}" class="h-9 px-4 rounded-full bg-white border border-[#EAE0D5] hover:border-[#201C19] mono text-[10.5px] font-[800] cursor-pointer">${LIVE[m.id] ? 'Take over scoring' : 'Keep score'}</button></div>
  </div>`;
}

function detectMyChanges(mine){
  let seen = null;
  try { seen = JSON.parse(lsGet('seen') || 'null'); } catch(e){ seen = null; }
  const current = {};
  mine.forEach(m => { current[m.id] = { fp: schedulePublished() ? schedFp(m.sched) : '', text: schedulePublished() && m.sched ? `${pubVenueCourt(m.sched)} · ${m.sched.date} · ${pubFmtMin(m.sched.startMin)}` : 'no time yet' }; });
  if(!schedulePublished()) return { changes: [], current };
  if(!seen){ lsSet('seen', JSON.stringify(current)); return { changes: [], current }; }
  const changes = [];
  mine.forEach(m => {
    const was = seen[m.id];
    if(!was){ if(current[m.id].fp) changes.push({ m, kind: 'new', was: null, now: current[m.id].text }); return; }
    if(was.fp !== current[m.id].fp && !PLAYED_STATUSES.includes(m.status)) changes.push({ m, kind: was.fp ? 'moved' : 'scheduled', was: was.text, now: current[m.id].text });
  });
  return { changes, current };
}
function pubVenueCourt(s){
  const v = ((PUB_T && PUB_T.venues) || []).find(x => x.id === s.venueId);
  const c = v && (v.courts || []).find(x => x.id === s.courtId);
  return `${v ? v.name : 'Venue'}${c ? ' - ' + c.name : ''}`;
}

function renderMyMatches(){
  const wrap = document.getElementById('myResult');
  if(!MY.regIds.size){ wrap.innerHTML = ''; return; }
  if(!matchesLoaded){ wrap.innerHTML = '<div class="mono text-[11px] opacity-60">Loading your matches…</div>'; return; }
  const mine = ALL_MATCHES.filter(m => !(m.isBye || (m.participantIds || []).includes('BYE')) && mySide(m) >= 0);
  const teams = MY.regs.map(r => (r.playerNames || []).join(' & ')).filter(Boolean);
  const unplayed = mine.filter(m => !PLAYED_STATUSES.includes(m.status));
  const played = mine.filter(m => PLAYED_STATUSES.includes(m.status));
  const keyOf = (m) => (schedulePublished() && m.sched) ? slotStartMs(m.sched) : Infinity;
  unplayed.sort((a, b) => keyOf(a) - keyOf(b));
  const nextId = unplayed.length && keyOf(unplayed[0]) !== Infinity ? unplayed[0].id : null;

  const { changes, current } = detectMyChanges(mine);
  const banner = changes.length ? `
    <div class="mb-3 p-3 rounded-[14px] bg-[#FFF3D6] border border-[#F2D58A]">
      <div class="mono text-[11px] font-[800]">⚠️ ${changes.length === 1 ? 'A change to your schedule' : `${changes.length} changes to your schedule`}</div>
      <ul class="mt-1.5 space-y-1">${changes.map(c => `<li class="mono text-[10.5px] leading-[1.5]">vs <b>${escapeHtml((c.m.participantNames || [])[mySide(c.m) === 0 ? 1 : 0] || 'TBD')}</b>: ${c.kind === 'moved' ? `moved to <b>${escapeHtml(c.now)}</b> <span class="opacity-60">(was ${escapeHtml(c.was)})</span>` : c.kind === 'scheduled' ? `now set for <b>${escapeHtml(c.now)}</b>` : `new match — <b>${escapeHtml(c.now)}</b>`}</li>`).join('')}</ul>
      <button type="button" id="myAckChanges" class="mt-2 h-8 px-3.5 rounded-full bg-[#201C19] text-white mono text-[10px] font-[800] cursor-pointer">Got it</button>
    </div>` : '';
  wrap.innerHTML = `
    <div class="mono text-[10.5px] opacity-60 mb-2">Showing matches for <b>${escapeHtml(teams.join(' · '))}</b> · <button type="button" id="myForget" class="underline cursor-pointer">not you?</button></div>
    ${banner}
    <div id="myAlerts" class="mb-3"></div>
    ${unplayed.length ? `<div class="mono text-[9.5px] uppercase tracking-widest opacity-50 mb-1.5">Coming up</div><div class="space-y-1.5">${unplayed.map(m => myMatchCard(m, { next: m.id === nextId })).join('')}</div>` : `<div class="mono text-[11px] opacity-60">${mine.length ? 'No more matches scheduled for you right now.' : (schedulePublished() ? 'No matches assigned to you yet.' : 'Your matches will appear here once the organizer publishes the schedule.')}</div>`}
    ${played.length ? `<div class="mono text-[9.5px] uppercase tracking-widest opacity-50 mt-4 mb-1.5">Results</div><div class="space-y-1.5">${played.map(m => myMatchCard(m)).join('')}</div>` : ''}`;
  document.getElementById('myForget').addEventListener('click', forgetMe);
  const ack = document.getElementById('myAckChanges');
  if(ack) ack.addEventListener('click', () => { lsSet('seen', JSON.stringify(current)); renderMyMatches(); });
  renderAlertsPanel();

  const next = unplayed.find(m => m.id === nextId);
  document.getElementById('myToggleHint').textContent = next
    ? `Next: vs ${(next.participantNames || [])[mySide(next) === 0 ? 1 : 0] || 'TBD'} ${countdownText(slotStartMs(next.sched) - Date.now())}`
    : (changes.length ? 'Your schedule changed' : 'See your court and time');
}

function forgetMe(){
  lsDel('phone'); lsDel('seen');
  MY = { regs: [], regIds: new Set(), playerId: null };
  document.getElementById('myResult').innerHTML = '';
  document.getElementById('myPhone').value = '';
  document.getElementById('myToggleHint').textContent = 'Find your court and time';
  myMsg('');
}

/* ---------------- alerts (web push) ---------------- */
const CALL_BASE = FIREBASE_CFG ? `https://asia-southeast1-${FIREBASE_CFG.projectId}.cloudfunctions.net` : '';
async function callFn(name, data){
  const r = await fetch(`${CALL_BASE}/${name}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data }) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok || j.error) throw new Error((j.error && j.error.message) || 'Something went wrong. Please try again.');
  return j.result;
}
function b64ToBytes(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
const isIos = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

function renderAlertsPanel(){
  const el = document.getElementById('myAlerts');
  if(!el) return;
  const box = (inner) => `<div class="p-3 rounded-[14px] bg-[#F1E9DF]">${inner}</div>`;
  const btn = (id, label, dark) => `<button type="button" id="${id}" class="h-9 px-4 rounded-full ${dark ? 'bg-[#201C19] text-white' : 'bg-white border border-[#EAE0D5]'} mono text-[10.5px] font-[800] cursor-pointer">${label}</button>`;
  const on = lsGet('alerts');
  if(!pushSupported()){
    el.innerHTML = box(`<div class="mono text-[11px] font-[800]">🔔 Match alerts</div><div class="mono text-[10.5px] leading-[1.6] opacity-70 mt-1">${isIos() && !isStandalone()
      ? 'On iPhone/iPad: tap <b>Share</b> → <b>Add to Home Screen</b>, open this page from your home screen, then turn on alerts here.'
      : "This browser can't receive alerts. Keep this page open, or bookmark it, and it will show your court and time as they change."}</div>`);
    return;
  }
  if(Notification.permission === 'denied'){
    el.innerHTML = box(`<div class="mono text-[11px] font-[800]">🔔 Match alerts are blocked</div><div class="mono text-[10.5px] leading-[1.6] opacity-70 mt-1">Allow notifications for this site in your browser settings, then come back and turn them on.</div>`);
    return;
  }
  if(on && Notification.permission === 'granted'){
    el.innerHTML = box(`<div class="flex items-center justify-between gap-2 flex-wrap"><div><div class="mono text-[11px] font-[800]">🔔 Alerts are on for this device</div><div class="mono text-[10.5px] opacity-70 mt-0.5">We'll tell you before your matches and if a court or time changes.</div></div>${btn('myAlertsOff', 'Turn off')}</div>`);
    document.getElementById('myAlertsOff').addEventListener('click', disableAlerts);
    return;
  }
  el.innerHTML = box(`<div class="flex items-center justify-between gap-2 flex-wrap"><div><div class="mono text-[11px] font-[800]">🔔 Get match alerts</div><div class="mono text-[10.5px] opacity-70 mt-0.5">A heads-up before each of your matches, and if a court or time changes.</div></div>${btn('myAlertsOn', 'Turn on alerts', true)}</div><div id="myAlertsErr" class="hidden mono text-[10.5px] mt-2" style="color:#8C2C10"></div>`);
  document.getElementById('myAlertsOn').addEventListener('click', enableAlerts);
}
function alertsError(text){
  const e = document.getElementById('myAlertsErr');
  if(e){ e.textContent = text; e.classList.remove('hidden'); }
}
async function enableAlerts(){
  const b = document.getElementById('myAlertsOn');
  if(b){ b.disabled = true; b.textContent = 'Turning on…'; }
  try {
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ renderAlertsPanel(); return; }
    await navigator.serviceWorker.register('/sw.js', { scope: '/' });
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC_KEY) }); }
      catch(e){ throw new Error("Your browser wouldn't allow alerts here. Try again, or use the latest Chrome, Edge, Firefox or Safari."); }
    }
    const json = sub.toJSON();
    await callFn('subscribeMatchAlerts', { clientId: currentClientId, tournamentId: CURRENT_TOURNAMENT_ID, phone: lsGet('phone') || document.getElementById('myPhone').value, subscription: { endpoint: json.endpoint, keys: json.keys } });
    lsSet('alerts', json.endpoint);
    renderAlertsPanel();
  } catch(ex){
    renderAlertsPanel();
    alertsError(ex.message || 'Could not turn on alerts.');
  }
}
async function disableAlerts(){
  try {
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      callFn('unsubscribeMatchAlerts', { clientId: currentClientId, tournamentId: CURRENT_TOURNAMENT_ID, endpoint }).catch(() => {});
    }
  } catch(e){ /* fall through: the local flag is what the UI trusts */ }
  lsDel('alerts');
  renderAlertsPanel();
}

function initMyMatches(){
  document.getElementById('myToggle').addEventListener('click', () => setMyOpen(document.getElementById('myBody').classList.contains('hidden')));
  document.getElementById('myForm').addEventListener('submit', (e) => { e.preventDefault(); lookupMyMatches(document.getElementById('myPhone').value); });
  const saved = lsGet('phone');
  if(saved){
    document.getElementById('myPhone').value = saved;
    lookupMyMatches(saved).then(ok => { if(ok) setMyOpen(true); });
  }
  if(location.hash === '#my'){ setMyOpen(true); document.getElementById('my').scrollIntoView(); }
}

/* ================================================================
   INIT
   ================================================================ */
async function init(){
  if(!currentClientId || !CURRENT_TOURNAMENT_ID){ showNotFound(); return; }
  if(!db){ renderGateState(`<p class="mt-5 mono text-[12px] text-[#8C2C10]">Firebase is not configured.</p>`); return; }

  try {
    const configSnap = await db.doc(`clients/${currentClientId}/config/state`).get();
    const cfg = (configSnap.exists && configSnap.data().data) || {};
    const bizName = (cfg.business && cfg.business.name) || cfg.businessName || currentClientId;

    db.doc(`clients/${currentClientId}/tournaments/${CURRENT_TOURNAMENT_ID}`).onSnapshot(async (snap) => {
      if(!snap.exists){ showNotFound(); return; }
      const t = snap.data();
      if(t.status === 'draft'){ showNotPublished(); return; }
      const wasPublished = schedulePublished();
      PUB_T = t;
      if(wasPublished !== schedulePublished() && LAST_MATCHES.length) renderSchedule(LAST_MATCHES);

      document.getElementById('gateScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      renderHeader(t, bizName);
      if(!window.__myInit){ window.__myInit = true; initMyMatches(); }
      if(MY.regIds.size) renderMyMatches();

      if(!DIVISIONS.length) await loadDivisionsAndRender();
      if(MY.regIds.size) renderMyMatches();
      subscribeToGallery();
      subscribeLive();
    }, ex => {
      renderGateState(`<p class="mt-5 mono text-[12px] text-[#8C2C10]">Failed to load: ${escapeHtml(ex.message)}</p>`);
    });
  } catch(ex) {
    renderGateState(`<p class="mt-5 mono text-[12px] text-[#8C2C10]">Failed to load: ${escapeHtml(ex.message)}</p>`);
  }
}
init();
</script>
